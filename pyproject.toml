[project]
name = "resume-master"
version = "3.2.0"
description = "Evidence-first Chinese resume workflow with one DOCX to Microsoft Word PDF production route"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1",
  "PyMuPDF>=1.24",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "lxml>=4.9",
  "fonttools>=4.50",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
