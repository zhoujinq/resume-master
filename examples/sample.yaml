facts:
  - {id: F001, statement: 独立设计 12 封新人引导邮件，示例激活率为 30%。, status: confirmed, ownership: personal, source: 虚构样例事实, note: 可解释激活口径与邮件分批方式。}
  - {id: F002, statement: 独立分析 3 个用户分群，示例次周留存提升 20%。, status: confirmed, ownership: personal, source: 虚构样例事实, note: 可解释分群条件与留存口径。}
  - {id: F003, statement: 协助团队完成 2 次运营复盘，只负责材料整理。, status: authorized, ownership: assisted, source: 虚构样例授权调整, note: 不主张独立主导复盘。}
  - {id: F004, statement: 独立编写 4 份新人指南，示例重复咨询下降 30%。, status: confirmed, ownership: personal, source: 虚构样例事实, note: 可说明咨询统计周期。}
  - {id: F005, statement: 团队共同上线 5 场用户活动，本人负责报名整理。, status: confirmed, ownership: team, source: 虚构样例事实, note: 团队成果不归为个人独立成果。}
  - {id: F006, statement: 独立用 7 天完成一个演示型反馈整理工具。, status: confirmed, ownership: demo, source: 虚构样例项目, note: 演示项目不冒充生产环境成果。}
  - {id: F007, statement: 独立整理 6 个内容模板，示例整理时间下降 40%。, status: confirmed, ownership: personal, source: 虚构样例项目, note: 可展示模板结构与计时口径。}
  - {id: F008, statement: 协助 3 个跨职能小组统一反馈标签。, status: confirmed, ownership: assisted, source: 虚构样例项目, note: 本人只负责标签表维护。}
  - {id: F009, statement: 独立清理 200 条演示记录，抽样核对 95% 的标签一致性。, status: confirmed, ownership: demo, source: 虚构样例项目, note: 演示数据不作为真实业务业绩。}
  - {id: F010, statement: 完成示例大学管理学本科学习。, status: confirmed, ownership: personal, source: 虚构样例教育经历, note: 学校与学位均为虚构。}
  - {id: F011, statement: 能使用英语进行书面工作沟通。, status: confirmed, ownership: personal, source: 虚构样例技能, note: 不虚构语言考试成绩。}
  - {id: F012, statement: 能使用表格进行分群、透视与基础图表分析。, status: confirmed, ownership: personal, source: 虚构样例技能, note: 可现场解释常用函数。}
