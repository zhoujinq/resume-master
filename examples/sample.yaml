# 虚构样例，人物与公司均为占位，用于演示 resume-master 的渲染与门禁
meta:
  name: 张三
  role: 海外销售经理 · 企业服务
  contact:
    - "138 0000 0000"
    - "zhangsan@example.com"
    - "示例城市 · 可接受外派"
  links:
    - { label: 作品集, url: "https://example.com/work/", short: "example.com/work" }
    - { label: GitHub, url: "https://github.com/example", short: "github.com/example" }
  stats:
    - { n: "2,100 万", l: "近三年签单" }
    - { n: "68 家", l: "海外渠道客户" }
    - { n: "12 国", l: "覆盖市场" }
    - { n: "4 人", l: "带团队规模" }
  lede: >
    通信工程科班，六年海外 B2B，两次长期外派（东南亚 / 西欧）。
    我的做法是先摸清客户的决策链和验收口径，再决定报什么方案，所以签单周期比团队均值短约三成。
    现在负责企业服务产品线的海外渠道，下一步想把区域从 12 国扩到 20 国。

style:
  preset: swiss
  accent: "#2F5BEA"
  density: normal

sections:
  - title: 工作经历
    items:
      - org: 示例科技（虚构）
        role: 海外销售经理 · 企业服务产品线
        date: 2023.04 – 至今
        bullets:
          - "**近三年签单 2,100 万元**（含续约 640 万元），客户以制造业与物流企业为主，平均客单价 31 万元。"
          - "**接手时渠道只有 9 家、集中在 2 个国家**：判断问题不是覆盖不足而是渠道质量，于是按成交周期与复购把 9 家分成三档，只给 A 档配售前，一年后 A 档贡献 78% 回款。"
          - "**把报价从「一单一议」改成三档标准包**：此前 60% 的商机卡在报价环节，改后从首次接触到出方案由 11 天压到 4 天。"
          - "**带 4 人团队负责 12 国**，其中 7 国为远程管理；建立周度商机评审，把预测准确率从 55% 提到 82%。"
          - "**把售前从「来单才配」改成「按渠道档位配」**：此前 A 档渠道也常等两周才拿到方案，改后平均响应 2 天，A 档续约率提升 11 个百分点。"
          - "**接手第一年砍掉 3 个低效市场**：年投入 120 万元、回款不足 30 万元的两个国家停投，预算转投物流行业，第二年该行业贡献 46% 新增。"
      - org: 示例国际贸易（虚构）
        role: 区域销售主管 · 东南亚
        date: 2020.07 – 2023.03
        bullets:
          - "**常驻吉隆坡 14 个月**，从零开发 36 家分销商，其中 11 家进入年度复购，区域业绩由第 6 升至第 2。"
          - "**解决的是账期而不是价格**：本地分销商普遍要求 90 天账期，改成「30 天 + 提前付款折扣」后，回款周期缩短 41 天，退货率下降 6 个百分点。"
          - "**把选品权交回分销商**：原来总部统一压货、滞销率 18%，改为给建议清单、分销商自主订货后，滞销率降到 7%。"
      - org: 示例教育科技（虚构）
        role: 商务拓展实习
        date: 2019.09 – 2020.05
        bullets:
          - "**从 0 搭建校园渠道**：签下 23 所高校代理，单月最高流水 47 万元，实习期结束转为兼职顾问。"

  - title: 项目
    note: 自己搭的，每天都在用
    items:
      - org: 渠道健康度看板
        role: 需求 → 设计 → 实现 → 自用
        date: ""
        bullets:
          - "**把三家渠道的数据并成一张表**：原来每周手工汇总 3 小时，现在自动出结果，异常渠道 24 小时内能被看到。"
      - org: 报价流水线
        role: 减少重复劳动
        date: ""
        bullets:
          - "**模板 + 参数化配置**，把 12 页报价书从 90 分钟压到 15 分钟，团队 4 人共用，季度节省约 60 工时。"
      - org: 区域市场准入清单
        role: 把踩过的坑变成可复用材料
        date: ""
        bullets:
          - "**12 国的准入要求整理成一张表**（认证、税务、代理资质），新市场启动从 6 周降到 2 周，后来被总部拿去复用。"
          - "**判断哪一国不值得进**同样写进表里：3 个国家因认证周期超过 9 个月、且年需求不足 200 万元，明确放弃，省下约 40 万元前期投入。"
      - org: 新人上手手册
        role: 带团队的副产品
        date: ""
        bullets:
          - "**把「第一次拜访—方案—报价—签约」拆成 9 个动作**并配上话术，新人独立接管区域的时间从 4 个月缩短到 7 周。"
          - "**手册每季度由团队自更新**，我只审判断错误的那几条；两年迭代 6 版，累计被 11 名同事使用。"

  - title: 教育背景
    items:
      - org: 示例大学（虚构）
        role: 通信工程 · 本科
        date: 2016.09 – 2020.06
        bullets:
          - "**GPA 3.5/4.0**；主修信号与系统、通信原理、数据结构；毕业设计为室内定位算法，定位误差从 2.1 米降到 0.8 米。"
          - "**校队与社团**：英语辩论队两年，负责立论稿；这段训练后来直接用在英文提案的结构上。"

  - title: 技能
    bullets:
      - "**语言**：英语（可独立做提案与谈判，常驻海外累计 26 个月）、马来语（日常沟通）"
      - "**工具**：Salesforce 商机管理、Power BI 报表、Python 数据处理"
      - "**商务**：渠道分层与激励设计、跨区域远程团队管理、合同与账期谈判"
      - "**分析**：能用 Excel 与 Python 做区域漏斗归因，判断问题出在覆盖、转化还是价格"
      - "**证书**：PMP（2022）、剑桥商务英语高级（BEC Higher）"
