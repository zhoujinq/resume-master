      - org: 示例智能科技有限公司
        role: 用户运营
        date: 2023.07–至今
        logo: "../assets/sample-logo.png"
        logo_width: 5.6
        bullets:
          - {text: "独立设计 [[12 封]]新人引导邮件，按用户行为分批发送，示例激活率达到 **30%**。", facts: [F001]}
          - {text: "独立分析 3 个用户分群，定位新手流程中的流失节点，示例次周留存提升 **20%**。", facts: [F002]}
          - {text: "协助团队完成 2 次运营复盘，仅负责材料整理与问题清单维护。", facts: [F003]}
          - {text: "独立编写 4 份新人指南，将高频问题整理为可检索条目，示例重复咨询下降 **30%**。", facts: [F004]}
          - {text: "团队共同上线 5 场用户活动，本人负责报名整理与会后反馈归档。", facts: [F005]}
      - org: 示例互联网公司
        role: 运营助理
        date: 2021.07–2023.06
        bullets:
          - {text: "参与用户反馈整理，沿用 3 个分群口径标记问题并输出每周摘要。", facts: [F002]}
          - {text: "协助 2 次复盘材料准备，记录待办、负责人和后续核对结果。", facts: [F003]}
          - {text: "将常见问题补入 4 份新人指南，保持术语与产品界面一致。", facts: [F004]}
  - title: 教育背景
