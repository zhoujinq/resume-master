        role: 管理学本科
        date: 2017.09–2021.06
        bullets:
          - {text: "完成管理学本科学习，重点修读市场调研与统计分析课程。", facts: [F010]}
  - title: 项目经历
    note: 虚构演示项目
    variant: project
    body: 项目只展示问题、个人动作与可核验结果；演示数据不冒充真实业务业绩。
    items:
      - org: 用户反馈整理工具
        date: 2025.02–2025.03
        url: "https://example.com/feedback-demo"
        bullets:
          - {text: "独立用 7 天完成演示型反馈整理工具，先定义标签，再设计人工复核步骤。", facts: [F006]}
          - {text: "整理 6 个内容模板，把重复说明拆成可复用结构，示例整理时间下降 **40%**。", facts: [F007]}
      - org: 跨团队反馈标签表
        date: 2024.10–2024.12
        url: "https://example.com/taxonomy-demo"
        bullets:
          - {text: "协助 3 个跨职能小组统一反馈标签，本人负责标签表维护与版本记录。", facts: [F008]}
          - {text: "将分歧项保留给团队复核，不夸大本人职责。", facts: [F008]}
      - org: 演示数据清理与核对
        date: 2024.05–2024.06
        url: "https://example.com/data-demo"
        bullets:
          - {text: "独立清理 200 条演示记录，保留原始值、修改值与核对状态。", facts: [F009]}
