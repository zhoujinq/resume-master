# 虚构样例：同一引擎渲染非简历文档（一页纸商业假设）
# 演示 section 的 body 写法与 note 小注；人物与公司均为占位
meta:
  name: 示例：一页纸商业假设
  role: 示例公司 · 海外渠道 · 面试材料
  contact:
    - "张三"
    - "2026.11"
    - "v1 · 一页纸"
  photo_w: 0
  lede: >
    增量不在「还没买过设备的客户」，在「已经自建过一套方案、但被维护成本和迭代速度卡住的中型团队」。
    这份假设只回答三个问题：客户在哪、从谁开始、前 90 天怎么验证。

style:
  preset: swiss
  accent: "#2F5BEA"
  density: normal
  body_size: 9.4
  name_size: 23
  name_track: 0.2

sections:
  - title: 一、客户在哪
    note: 三个池子，三种打法
    items:
      - org: 制造业中型工厂
        role: 最熟的一块
        date: ""
        bullets:
          - "已有 2–5 人的自动化小组，自建方案的问题不是买不起，而是每换一次产线就要重做一遍集成。"
      - org: 跨境物流企业
        role: 决策链最短
        date: ""
        bullets:
          - "分拣与仓储两条线标准度高，愿意为「少停线」付费，价格敏感度低于制造业。"
      - org: 高校与科研机构
        role: 预算制
        date: ""
        bullets:
          - "采购周期长但复购稳定，适合做标杆案例而不是做流水。"
  - title: 二、从谁开始
    note: 我的判断
    items:
      - org: 先打物流，再打制造
        role: 反直觉但可验证
        date: ""
        bullets:
          - "物流的标准度高、验收口径统一，前 3 单可以复制；制造业每单都要重新定义验收，适合在第 4 单之后进。"
  - title: 三、前 90 天怎么验证
    bullets:
      - "**0–30 天**：列 30 家目标客户，用停线成本做钩子，拿到 10 次现场拜访。"
      - "**31–60 天**：把其中 5 家推进到方案报价，记录每次卡住的环节，判断是价格还是集成复杂度。"
      - "**61–90 天**：签下 1 个试点、2 个意向；若试点都签不下，说明客户池判断错了，换池子而不是降价。"
